name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pinned to exact commit SHAs for supply-chain security. Bump these
      # deliberately by moving to the new SHA (reference the action/vN tag).
      # Gradle wrapper validation runs automatically via gradle/actions/setup-gradle.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # gradle/actions/setup-gradle@v6

      - name: Run all quality gates
        run: ./gradlew spotlessCheck detekt :app:lint testDebugUnitTest :app:assembleDebug --continue
